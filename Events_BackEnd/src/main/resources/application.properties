spring.application.name=EventsGroup1

# CRITICAL for WildFly WAR: force servlet mode.
# Without this, Spring Boot detects both WebFlux and Web on the classpath
# and may try to start in reactive mode inside the servlet container.
spring.main.web-application-type=servlet
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:postgres.mcgxnkdegikrmbqhrqgt}
spring.datasource.password=${DATABASE_PASSWORD:_s8$u4iAUNr%vNy}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimized for Supabase / Cloud Postgres)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Add explicit dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Make sure Hibernate connects to the DB during initialization
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Gemini AI Configuration
# IMPORTANT: Use environment variable in production for security
gemini.api.key=${GEMINI_API_KEY:AIzaSyBOwcUr3ZFiPkVYhmc3TWSorn2k_vPU__c}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent

# Server Configuration - Railway provides PORT env var
server.port=${PORT:8080}

# CORS Configuration - allow deployed frontend
spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true